# GitHub Pages is no longer the primary host. The app needs the
# Netlify geocoding proxy at /api/geocoding, which Pages cannot serve.
# See DEPLOYMENT.md. This workflow is kept only as a manual no-op so
# existing Pages settings are not silently overwritten.
name: GitHub Pages (disabled)

on:
  workflow_dispatch:

jobs:
  skipped:
    runs-on: ubuntu-latest
    steps:
      - name: Explain why this is disabled
        run: |
          echo "Deploy to GitHub Pages is disabled."
          echo "Host the app on Netlify so /api/geocoding works. See DEPLOYMENT.md."
          exit 0
